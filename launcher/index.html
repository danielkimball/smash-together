<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101319" />
    <title>Smash Together</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b101b;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      #connection {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 24px;
        background: #101725;
        z-index: 2;
      }
      #connection[hidden] {
        display: none;
      }
      h1 {
        font-size: clamp(30px, 7vw, 58px);
        font-style: italic;
        color: #ffda67;
        margin: 0;
      }
      p {
        max-width: 450px;
        color: #c5cfe1;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 4px;
        background: #ffda67;
        padding: 13px 24px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="connection">
      <h1>SMASH TOGETHER</h1>
      <p id="message">Connecting to the game…</p>
      <button id="retry" hidden>Try again</button>
    </div>
    <script type="module">
      const message = document.getElementById("message"),
        retry = document.getElementById("retry");
      async function connect() {
        retry.hidden = true;
        try {
          const response = await fetch("./server.json?t=" + Date.now(), {
            cache: "no-store",
          });
          if (!response.ok) throw Error("Host unavailable");
          const data = await response.json(),
            url = new URL(data.url);
          if (
            url.protocol !== "https:" ||
            !/^[a-z0-9-]+\.trycloudflare\.com$/.test(url.hostname) ||
            url.pathname !== "/"
          )
            throw Error("Invalid host");
          message.textContent = "Opening the game directly on Cloudflare…";
          location.replace(
            url.origin +
              "/" +
              (/^#room=[a-f0-9]{36}$/.test(location.hash) ? location.hash : ""),
          );
        } catch {
          message.textContent =
            "The host is unavailable. Ask your host for the current Cloudflare link.";
          retry.hidden = false;
        }
      }
      retry.onclick = connect;
      connect();
    </script>
  </body>
</html>
