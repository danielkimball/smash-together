<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101319" />
    <title>Smash Together</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b101b;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      iframe {
        position: fixed;
        inset: 0;
        border: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
      }
      #connection {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 24px;
        background: #101725;
        z-index: 2;
      }
      #connection[hidden] {
        display: none;
      }
      h1 {
        font-size: clamp(30px, 7vw, 58px);
        font-style: italic;
        color: #ffda67;
        margin: 0;
      }
      p {
        max-width: 450px;
        color: #c5cfe1;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 4px;
        background: #ffda67;
        padding: 13px 24px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <iframe
      id="game"
      title="Smash Together game"
      allow="fullscreen; autoplay; gamepad; clipboard-write"
      allowfullscreen
    ></iframe>
    <div id="connection">
      <h1>SMASH TOGETHER</h1>
      <p id="message">Connecting to the game…</p>
      <button id="retry" hidden>Try again</button>
    </div>
    <script type="module">
      const frame = document.getElementById("game"),
        panel = document.getElementById("connection"),
        message = document.getElementById("message"),
        retry = document.getElementById("retry");
      let server = "",
        ready = false,
        pending = false;
      function roomHash() {
        return /^#room=[a-f0-9]{36}$/.test(location.hash) ? location.hash : "";
      }
      async function connect() {
        if (pending) return;
        pending = true;
        try {
          const response = await fetch("./server.json?t=" + Date.now(), {
            cache: "no-store",
          });
          if (!response.ok) throw Error("Host unavailable");
          const data = await response.json(),
            url = new URL(data.url);
          if (
            url.protocol !== "https:" ||
            !url.hostname.endsWith(".trycloudflare.com") ||
            url.pathname !== "/"
          )
            throw Error("Invalid host");
          if (server !== url.origin || (!ready && retry.hidden === false)) {
            server = url.origin;
            ready = false;
            panel.hidden = false;
            retry.hidden = true;
            message.textContent = "Connecting to the game…";
            frame.src = server + "/" + roomHash();
            setTimeout(() => {
              if (!ready) {
                message.textContent =
                  "The host may be restarting or asleep. Keep this address—it stays the same. The host laptop needs to be awake to play.";
                retry.hidden = false;
              }
            }, 20000);
          }
        } catch {
          if (!ready) {
            message.textContent =
              "The game host is currently unavailable. Try again shortly.";
            retry.hidden = false;
          }
        } finally {
          pending = false;
        }
      }
      window.addEventListener("message", (event) => {
        if (event.source !== frame.contentWindow || event.origin !== server)
          return;
        if (event.data?.type === "smash-ready") {
          ready = true;
          panel.hidden = true;
        }
        if (
          event.data?.type === "smash-room" &&
          /^[a-f0-9]{36}$/.test(event.data.token)
        )
          history.replaceState(null, "", "#room=" + event.data.token);
        if (event.data?.type === "smash-room" && event.data.token === "")
          history.replaceState(null, "", location.pathname);
      });
      window.addEventListener("hashchange", () => {
        if (server) frame.src = server + "/" + roomHash();
      });
      retry.onclick = () => {
        ready = false;
        connect();
      };
      setInterval(connect, 15000);
      connect();
    </script>
  </body>
</html>
